server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: entraide-intranet
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/entraide?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:entraide}
    password: ${DB_PASSWORD:entraide}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: always

app:
  jwt:
    # Obligatoire en production : au moins 32 caractères, fourni par l'environnement.
    secret: ${APP_JWT_SECRET:}
    ttl: ${APP_JWT_TTL:8h}
  cookie:
    name: access_token
    secure: ${APP_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${APP_API_DOCS:false}
  swagger-ui:
    enabled: ${APP_API_DOCS:false}
