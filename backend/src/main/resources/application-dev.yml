# Profil de développement : données d'exemple, documentation de l'API, cookie non sécurisé (http local).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
  cookie:
    secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
